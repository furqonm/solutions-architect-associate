Description: >
  Standard Linux EC2 instance with Apache, PHP, and a Security Group to allow web traffic.

#----------------------------------------------------------------------------------------#
Resources:
  # This is our "Firewall" rule. Without this, your web server is invisible to the world.
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic on port 80
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # This means "Allow anyone from the internet"

  # Our virtual computer (EC2)
  EC2:
    Type: AWS::EC2::Instance
    Properties:
      # Amazon Linux 2023 (Latest version in us-east-1 as of early 2026)
      ImageId: ami-098e39bafa7e7303d 
      InstanceType: t3.micro
      
      # We tell the EC2 instance to use the "Firewall" we created above
      SecurityGroups:
        - !Ref WebServerSecurityGroup

      # The "First-Boot" script
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Update system and install the Web Server + PHP engine
          yum update -y
          yum install -y httpd php
          
          # Start the engine
          systemctl start httpd
          systemctl enable httpd
          
          # Create the web pages
          echo "<?php phpinfo(); ?>" > /var/www/html/info.php
          echo "<html><h1>Hello from EC2 with PHP!</h1></html>" > /var/www/html/index.html

      Tags: 
      - Key: Name
        Value: MyReadyToGoWebServer

#----------------------------------------------------------------------------------------#
Outputs:
  # The Public IP is what you paste into your browser's address bar.
  WebsiteURL:
    Value: !Sub "http://${EC2.PublicIp}"
    Description: Click this link to see your website!

  EC2ID:
    Value: !Ref EC2
    Description: The unique ID of your server.
