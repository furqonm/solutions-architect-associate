Description: >
  Standard Linux EC2 instance with a minimal web server configuration (Apache + PHP).

#----------------------------------------------------------------------------------------#
Resources:
  # Create an EC2 instance. For a beginner, think of this as ordering a virtual computer 
  # from the AWS "factory" with specific hardware and software settings.
  EC2:
    Type: AWS::EC2::Instance
    Properties:
      # This ID refers to a specific version of Amazon Linux. 
      # WARNING: This ID is specific to the us-east-1 (N. Virginia) region.
      ImageId: ami-098e39bafa7e7303d
      InstanceType: t3.micro
      
      # UserData is a script that runs automatically ONLY the first time the instance starts.
      # It is great for installing software so the server is ready to use immediately.
      UserData:
        # Fn::Base64: AWS requires this script to be encoded. 
        # The "|" symbol allows us to write the script across multiple lines easily.
        Fn::Base64: |
          #!/bin/bash
          # Update the package manager to ensure we have the latest security patches
          yum update -y
          
          # Install Apache (httpd) and PHP
          yum install -y httpd php
          
          # Start the web server and ensure it restarts if the instance reboots
          systemctl start httpd
          systemctl enable httpd
          
          # Create a simple PHP test page to verify installation
          echo "<?php phpinfo(); ?>" > /var/www/html/info.php
          
          # Create a friendly landing page
          echo "<html><h1>Hello from EC2 with PHP!</h1></html>" > /var/www/html/index.html

      # Tags help you organize your resources. Think of them as "sticky notes" on your server.
      Tags: 
      - Key: Name
        Value: MyPHPWebServer
      - Key: OS
        Value: Amazon Linux 2

#----------------------------------------------------------------------------------------#
Outputs:
  # Outputs display useful information in the CloudFormation console once the "stack" is finished.
  
  EC2ID:
    Value:
      Ref: EC2
    Description: The unique ID assigned to your new instance.

  EC2PrivateIP:
    Value:
      Fn::GetAtt: EC2.PrivateIp
    Description: The internal IP address (used for communication within AWS).

  EC2PublicDNS:
    Value:
      Fn::GetAtt: EC2.PublicDnsName
    Description: The public web address. Note: This changes if you stop and start the instance!

  EC2PublicIP:
    Value:
      Fn::GetAtt: EC2.PublicIp
    Description: The public IPv4 address to access your website from the internet.
