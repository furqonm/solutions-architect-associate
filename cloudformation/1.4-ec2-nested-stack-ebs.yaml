Description: >
  Main Stack: Provisions an EC2 instance and an EBS volume using Nested Stacks.
  
# A "Nested Stack" is essentially a stack within a stack. This modular approach 
# allows different teams (Network, Database, Security) to manage their own templates 
# while allowing a master template to pull them all together. Think of it like 
# building with Lego sets: one team builds the car, another builds the garage, 
# and this template puts the car inside the garage.
# Reference: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-nested-stacks.html

#----------------------------------------------------------------------------------------#
Resources:
  # This resource calls an external template to build the EC2 instance.
  # Documentation: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-stack.html
  EC2:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://furqonmauladani.s3.amazonaws.com/1.1-ec2-simple.yaml

  # This resource calls an external template to create an EBS (Elastic Block Store) volume.
  # Even though the nested template "3.1-ebs.yaml" might have several parameters 
  # (like Type or Size), we only need to provide the ones that don't have a 'Default' value.
  EBS:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://furqonmauladani.s3.amazonaws.com/3.1-ebs.yaml
      Parameters:
        AZ:
          # Fn::GetAZs: Retrieves a list of Availability Zones in the current region.
          # Fn::Select: Picks the first AZ from that list (Index 0). 
          # This ensures the volume is created in a valid zone automatically.
          Fn::Select: [0, Fn::GetAZs: ""]
        # EBSType: gp2 (Optional: Uses default from the nested template)
        # EBSSize: 1   (Optional: Uses default from the nested template)

  # This is the "bridge" that attaches the EBS volume to the EC2 instance.
  # Because the EC2 and EBS resources are in different stacks, we must "reach inside"
  # those stacks to grab their specific IDs.
  # Documentation: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-ec2-ebs-volumeattachment.html
  EBStoEC2:
    Type: AWS::EC2::VolumeAttachment
    Properties: 
      Device: /dev/sdh
      InstanceId:
        # Fn::GetAtt: Digs into the 'EC2' stack and pulls the 'EC2ID' from its Outputs.
        Fn::GetAtt: [EC2, Outputs.EC2ID]
      VolumeId:
        # Fn::GetAtt: Digs into the 'EBS' stack and pulls the 'EBSID' from its Outputs.
        Fn::GetAtt: [EBS, Outputs.EBSID]

#----------------------------------------------------------------------------------------#
Outputs:
  # When using nested stacks, you can't just reference the resource directly.
  # You must retrieve the values from the 'Outputs' section of the child template.

  PublicDNSofEC2:
    Value:
      Fn::GetAtt: [EC2, Outputs.EC2PublicDNS]
    Description: The Public DNS endpoint for the EC2 instance inside the nested stack.

  PublicIPofEC2:
    Value:
      Fn::GetAtt: [EC2, Outputs.EC2PublicIP]
    Description: The Public IPv4 address of the EC2 instance inside the nested stack.
